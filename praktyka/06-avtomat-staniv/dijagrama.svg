<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1000" height="520" fill="#fff"/>
<text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold">Діаграма станів: знайти обʼєкт і зупинитись біля нього</text>
<g stroke="#222" stroke-width="2" fill="#eef4ff">
<rect x="60" y="150" width="190" height="80" rx="8"/>
<rect x="400" y="150" width="190" height="80" rx="8"/>
<rect x="740" y="150" width="190" height="80" rx="8"/>
<rect x="740" y="340" width="190" height="80" rx="8" fill="#e6f7e6"/>
</g>
<g font-size="20" text-anchor="middle" font-weight="bold">
<text x="155" y="184">poshuk</text><text x="495" y="184">navedennya</text><text x="835" y="184">pidhid</text><text x="835" y="374">gotovo</text></g>
<g font-size="14" text-anchor="middle" fill="#333">
<text x="155" y="208">крутиться на місці</text><text x="495" y="208">центрує на обʼєкті</text><text x="835" y="208">їде вперед</text><text x="835" y="398">стоїть, кінець</text></g>
<g stroke="#222" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M10,190 L58,190"/>
<path d="M250,190 L398,190"/>
<path d="M590,190 L738,190"/>
<path d="M835,230 L835,338"/>
<path d="M760,150 C700,80 300,80 200,148"/>
</g>
<g font-size="14" text-anchor="middle" fill="#111">
<text x="324" y="166">d &lt; 100 см</text><text x="324" y="182" font-size="12">(бачу обʼєкт)</text>
<text x="664" y="146" font-size="12">пройшов обʼєкт і</text>
<text x="664" y="162" font-size="12">повернувся на</text><text x="664" y="178" font-size="12">його середину</text>
<text x="880" y="290">d &lt; 12 см</text>
<text x="480" y="88">d &gt; 130 см (обʼєкт загубили)</text>
<text x="30" y="178">старт</text>
</g>
<rect x="60" y="440" width="870" height="56" rx="8" fill="#fff4e5" stroke="#c77700" stroke-width="2"/>
<text x="495" y="464" text-anchor="middle" font-size="15">Таймаут: у будь-якому стані, крім gotovo, понад 25 с без виходу → «таймаут у стані …», мотори вимкнено, програма завершується.</text>
<text x="495" y="484" text-anchor="middle" font-size="15">Усі зміни стану — лише через perekhid(), яка друкує «старий -&gt; новий».</text>
</svg>
